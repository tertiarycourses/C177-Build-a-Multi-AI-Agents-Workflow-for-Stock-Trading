[project]
name = "trading-agents"
version = "1.0.0"
description = "A multi AI agents workflow for stock trading: lead, finance research, news sentiment, trading strategy, signal generation, stock trader, performance analysis and strategy review agents (C177 reference solution)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.50", "alpaca-py>=0.30", "anthropic>=0.40", "openai>=1.50"]
dashboard = ["streamlit>=1.38"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trading_agents*"]
